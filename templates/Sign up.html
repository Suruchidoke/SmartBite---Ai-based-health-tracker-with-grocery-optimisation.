<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBite - Sign Up</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts - Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            --color-sage-green: #8FBC8F;
            --color-beige: #F5F5DC;
            --color-off-white: #FCFCF4;
            --color-dark-grey: #36454F;
            --color-darker-sage-green: #7B9F7B;
            --color-dark-beige: #E0D8C4;
        }

        .bg-sage-green { background-color: var(--color-sage-green); }
        .bg-beige { background-color: var(--color-beige); }
        .bg-off-white { background-color: var(--color-off-white); }
        .text-dark-grey { color: var(--color-dark-grey); }
        .text-sage-green { color: var(--color-sage-green); }
        .border-sage-green { border-color: var(--color-sage-green); }
        .hover\:bg-sage-green-dark:hover { background-color: var(--color-darker-sage-green); }
        .hover\:text-sage-green-dark:hover { color: var(--color-darker-sage-green); }

        .input-field {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ccc;
            border-radius: 0.5rem;
            font-size: 1rem;
            color: var(--color-dark-grey);
            background-color: var(--color-off-white);
            transition: border-color 0.3s ease;
        }
        .input-field:focus {
            outline: none;
            border-color: var(--color-sage-green);
            box-shadow: 0 0 0 2px rgba(143, 188, 143, 0.3);
        }
        .error-border { border-color: #ef4444; }
    </style>
</head>
<body class="bg-beige text-dark-grey min-h-screen flex items-center justify-center">

    <!-- Sign Up Form Container -->
    <div class="bg-off-white p-8 md:p-12 rounded-lg shadow-2xl text-center max-w-lg w-full mx-4 relative">
        <h1 class="text-3xl md:text-4xl font-bold text-dark-grey mb-6">Create Your Account</h1>
        <p class="text-md text-sage-green mb-8">Nourish Your Body, Empower Your Life.</p>

        <!-- Flash messages from Flask -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="mb-4">
              {% for category, message in messages %}
                <p class="text-sm {% if category == 'error' %}text-red-500{% else %}text-green-500{% endif %}">{{ message }}</p>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Flask Sign-Up Form -->
        <form method="POST" action="{{ url_for('signup') }}" class="space-y-4">
            <input type="text" name="username" placeholder="Username" class="input-field" required>
            <input type="email" name="email" placeholder="Email" class="input-field" required>
            <input type="password" name="password" placeholder="Password (min 6 characters)" class="input-field" required>
            <input type="password" name="confirm_password" placeholder="Re-enter Password" class="input-field" required>

            <button type="submit" class="w-full bg-sage-green text-white px-6 py-3 rounded-full hover:bg-sage-green-dark transition-colors duration-300 shadow-md">
                Sign Up
            </button>
        </form>

        <p class="text-sm text-dark-grey mt-6">
            Already have an account? <a href="{{ url_for('login') }}" class="text-sage-green hover:underline font-medium">Sign In</a>
        </p>
    </div>
</body>
</html>
